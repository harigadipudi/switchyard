# cloudbuild-e2e.yaml
# Google Cloud Build pipeline to build the progressive Apigee bundles
# and execute the automated end-to-end verification suite across all 3 harnesses
# (Claude Code, Google Antigravity, and OpenAI Codex CLI/Desktop).
#
#   gcloud builds submit . --config tests/cloudbuild-e2e.yaml
steps:
  - name: "node:20-slim"
    id: "build-apigee-bundles"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        apt-get update && apt-get install -y zip python3
        chmod +x deploy.sh
        ./deploy.sh --stage 05-add-vertex-fallback --build-only
        ./deploy.sh --stage 06-add-pluggable-classifier --build-only

  # Each step starts from a fresh image, and the suite itself runs deploy.sh --build-only
  # (which shells out to zip), so the packages are installed again here.
  - name: "node:20-slim"
    id: "run-e2e-verification-suite"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        apt-get update && apt-get install -y zip python3
        python3 tests/verify_e2e.py

timeout: "900s"
options:
  logging: CLOUD_LOGGING_ONLY
